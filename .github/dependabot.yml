version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    versioning-strategy: 'increase-if-necessary'
    groups:
      storybook:
        patterns:
          - 'storybook'
          - '@storybook/*'
    reviewers:
      - 'ryo-manba'
